{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block page_title %}Re & Co | 대시보드{% endblock %}</title>

  <!-- 🧩 기본 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 🎨 공용 스타일 -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_head %}{% endblock %}
</head>

<body>
  <!-- 📱 상단 토글 버튼 -->
  <div id="navbar">
    <button class="togglebtn">&#9776;</button>
  </div>
  
  <!-- 📚 사이드바 -->
  <div id="mySidebar" class="sidebar">
    <div class="sidebar-header"></div>

    <!-- ♻️ 재활용 -->
    <a href="{% url 'upload' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=1P9tb6hUxL2T&format=png&color=000000"></span>
      <span class="text">recyclables</span>
    </a>

    <a href="{% url 'predict_list' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=1P9tb6hUxL2T&format=png&color=000000"></span>
      <span class="text">recycle data</span>
    </a>

    <!-- ☕ 커피 분석 섹션 -->
    <a href="{% url 'coffee_report' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=LbnEo5R8jVm8&format=png&color=000000"></span>
      <span class="text">Coffee Report</span>
    </a>

    <a href="{% url 'coffee' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=LbnEo5R8jVm8&format=png&color=000000"></span>
      <span class="text">Coffee Analysis</span>
    </a>

    <a href="{% url 'bmi' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=LbnEo5R8jVm8&format=png&color=000000"></span>
      <span class="text">BMI</span>
    </a>

    <a href="{% url 'sleep' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=LbnEo5R8jVm8&format=png&color=000000"></span>
      <span class="text">Sleep</span>
    </a>

    <a href="{% url 'stress' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=LbnEo5R8jVm8&format=png&color=000000"></span>
      <span class="text">Stress</span>
    </a>

    <!-- 🧠 RAG -->
    <a href="{% url 'rag' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=LbnEo5R8jVm8&format=png&color=000000"></span>
      <span class="text">RAG</span>
    </a>

    <!-- 📰 뉴스 / 설정 -->
    <a href="{% url 'news' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=44030&format=png&color=000000"></span>
      <span class="text">News</span>
    </a>

    <a href="{% url 'settings' %}">
      <span class="icon"><img src="https://img.icons8.com/?size=100&id=52146&format=png&color=000000"></span>
      <span class="text">Settings</span>
    </a>
  </div>

  <!-- 🧩 본문 -->
  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <!-- ⚙️ 공용 스크립트 -->
  <script src="{% static 'js/base.js' %}"></script>
  {% block extra_script %}{% endblock %}
</body>
</html>
