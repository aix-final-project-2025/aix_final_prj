# ============================================
# ☁️ Cloud Build 자동배포 설정 (AIX Final Project)
# Branch: deploy
# Author: Chang-Do (2025.10, Stable)
# Description:
#   - Cloud Run 자동 빌드 & 배포 파이프라인
#   - Dockerfile 내 collectstatic 및 uploads 폴더 생성 반영됨
# ============================================

steps:
  # 1️⃣ Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest',
        '.'
      ]

  # 2️⃣ Artifact Registry로 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'
      ]

  # 3️⃣ Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        '${_SERVICE_NAME}',
        '--image',
        '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest',
        '--region',
        '${_DEPLOY_REGION}',
        '--platform',
        '${_PLATFORM}',
        '--allow-unauthenticated',
        '--memory',
        '2Gi',
        '--timeout',
        '600',
        '--service-account',
        '${_SERVICE_ACCOUNT}',
        '--set-env-vars',
        'CLOUD_RUN_ENV=true,DJANGO_SETTINGS_MODULE=aix_final_prj.settings,PYTHONUNBUFFERED=1,PORT=8080,GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json'
      ]
    secretEnv: ['GOOGLE_APPLICATION_CREDENTIALS']

  # 4️⃣ 빌드 완료 로그 출력
  - name: 'alpine'
    entrypoint: /bin/sh
    args:
      - '-c'
      - |
        echo "✅ Cloud Build & Run Deploy Completed!"
        echo "🌿 Branch: ${BRANCH_NAME}"
        echo "🚀 Service: ${_SERVICE_NAME}"
        echo "📦 Artifact Registry: ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}"
        echo "☁️ Region: ${_DEPLOY_REGION}"
        echo "🕒 Timestamp: $(date +'%Y-%m-%d %H:%M:%S')"

# ============================================
# Artifact Registry 이미지 태그 지정
# ============================================
images:
  - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'

# ============================================
# 타임아웃 (최대 15분)
# ============================================
timeout: '900s'

# ============================================
# 로그 저장 옵션
# ============================================
options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

# ============================================
# 환경 변수 (Cloud Build Trigger 또는 수동 빌드 시 지정)
# ============================================
substitutions:
  _AR_HOSTNAME: 'asia-northeast3-docker.pkg.dev'
  _AR_PROJECT_ID: 'generated-tine-474316-j6'
  _AR_REPOSITORY: 'aix-final-prj'
  _SERVICE_NAME: 'aix-final-prj'
  _DEPLOY_REGION: 'asia-northeast3'
  _PLATFORM: 'managed'
  # ⚠️ GCS 접근 가능한 서비스 계정 (IAM에 roles/storage.admin 있어야 함)
  _SERVICE_ACCOUNT: 'cloud-build-deploy-aix-prj@generated-tine-474316-j6.iam.gserviceaccount.com'